services:
  postgres:
    image: postgres:16
    container_name: lab5-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "153303"
      POSTGRES_DB: productcatalog
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d productcatalog"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - lab5-network

  categories-api:
    build:
      context: ../lab4/src/ProductCatalog.CategoriesApi
      dockerfile: Dockerfile
    container_name: lab5-categories-api
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=productcatalog;Username=postgres;Password=153303"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lab5-network

  products-api:
    build:
      context: ./src/ProductCatalog.ProductsApi
      dockerfile: Dockerfile
    container_name: lab5-products-api
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=productcatalog;Username=postgres;Password=153303"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      categories-api:
        condition: service_started
    restart: unless-stopped
    networks:
      - lab5-network

volumes:
  postgres-data:

networks:
  lab5-network:
    driver: bridge
